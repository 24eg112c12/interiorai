spring.application.name=interiorai-backend
server.port=8080

# ===================================================================
# Database Configuration (MySQL 8.0+)
# Defaults connect to localhost:3306/interiorai_db
# Override with DB_URL, DB_USERNAME, DB_PASSWORD environment variables
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interiorai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization (seeds default professionals and styles)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===================================================================
# Multipart File Upload Configuration (Max 10MB per image)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Safe file upload directory for room photographs
interiorai.upload.dir=uploads/rooms

# ===================================================================
# Security / JWT Configuration
# ===================================================================
interiorai.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 Hours in milliseconds
interiorai.jwt.expiration-ms=86400000

# ===================================================================
# AI Image Generation Configuration
# When AI_API_KEY is blank or demo-mode=true, InteriorAI provides
# high-resolution demonstration transformations with realistic previews.
# ===================================================================
interiorai.ai.api-key=${AI_API_KEY:}
interiorai.ai.api-url=${AI_API_URL:https://api.openai.com/v1/images/generations}
interiorai.ai.demo-mode=${AI_DEMO_MODE:true}
interiorai.ai.model=${AI_MODEL:dall-e-3}

# Static content location & frontend CORS
interiorai.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080
