# ===================================================================
# Local Dev Profile (Embedded In-Memory H2 with MySQL mode)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:interiorai_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# SQL Initialization: Hibernate creates schema; data.sql seeds users and professionals
spring.sql.init.mode=always
spring.sql.init.schema-locations=
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
